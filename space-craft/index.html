<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpaceCraft — 宇宙惑星ボクセル</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #05060f; font-family: system-ui, sans-serif; }
    #game { display: block; width: 100vw; height: 100vh; cursor: crosshair; }

    /* クロスヘア */
    #crosshair {
      position: fixed; left: 50%; top: 50%; width: 20px; height: 20px;
      transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(255,255,255,0.85);
    }
    #crosshair::before { left: 9px; top: 0; width: 2px; height: 20px; }
    #crosshair::after { top: 9px; left: 0; height: 2px; width: 20px; }

    /* ホットバー */
    #hotbar {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
      display: flex; gap: 4px; padding: 4px; z-index: 10;
      background: rgba(10,12,28,0.6); border: 1px solid rgba(150,160,220,0.3);
      border-radius: 8px;
    }
    .slot {
      position: relative; width: 48px; height: 48px; border-radius: 6px;
      background: rgba(40,44,70,0.7); border: 2px solid transparent;
      display: flex; align-items: center; justify-content: center;
    }
    .slot img { width: 40px; height: 40px; image-rendering: pixelated; border-radius: 3px; }
    .slot .num {
      position: absolute; left: 3px; top: 1px; font-size: 11px;
      color: #cdd3ff; text-shadow: 0 1px 2px #000;
    }
    .slot.active { border-color: #ffe9b0; box-shadow: 0 0 10px rgba(255,233,176,0.6); }

    #blocklabel {
      position: fixed; left: 50%; bottom: 74px; transform: translateX(-50%);
      color: #e7eaff; font-size: 14px; text-shadow: 0 1px 3px #000; z-index: 10;
    }

    /* スタートオーバーレイ */
    #overlay {
      position: fixed; inset: 0; z-index: 50; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 30%, #18204a 0%, #05060f 70%);
      color: #e7eaff; text-align: center; cursor: pointer;
    }
    #overlay h1 { font-size: 44px; letter-spacing: 4px; margin-bottom: 8px;
      background: linear-gradient(90deg,#9fd, #b9f); -webkit-background-clip: text; background-clip: text; color: transparent; }
    #overlay p { opacity: 0.85; margin: 4px 0; font-size: 15px; }
    #overlay .keys { margin-top: 18px; font-size: 13px; line-height: 1.9; opacity: 0.9; }
    #overlay .start { margin-top: 24px; padding: 12px 28px; border: 1px solid #9fd;
      border-radius: 30px; font-size: 16px; animation: pulse 1.6s infinite; }
    @keyframes pulse { 0%,100%{ box-shadow:0 0 0 rgba(159,255,221,0); } 50%{ box-shadow:0 0 20px rgba(159,255,221,0.5);} }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="overlay">
    <h1>SPACECRAFT</h1>
    <p>遠い惑星のボクセルワールドへようこそ。</p>
    <p>低重力の地表で、掘って・積んで・建てよう。</p>
    <div class="keys">
      <div>移動: W A S D ／ 視点: マウス ／ ジャンプ: Space</div>
      <div>飛行モード: F ／ 飛行中の上下: Space / Shift</div>
      <div>破壊: 左クリック ／ 設置: 右クリック</div>
      <div>ブロック選択: 数字キー 1〜9 / ホイール</div>
    </div>
    <div class="start">クリックして開始 ▶</div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
